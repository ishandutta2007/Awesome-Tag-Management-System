<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: blur(30px); }
        50% { opacity: 0.75; filter: blur(45px); }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      .animated-float1 { animation: floatSlow 6s ease-in-out infinite; }
      .animated-float2 { animation: floatFast 4.5s ease-in-out infinite; }
      .pulse-bg1 { animation: pulseGlow 5s ease-in-out infinite; }
      .pulse-bg2 { animation: pulseGlow 7s ease-in-out infinite alternate; }
      .animated-border { stroke-dasharray: 60 140; animation: shimmerBorder 20s linear infinite; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .text-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  
  <!-- Outer Animated Border -->
  <rect width="1196" height="316" x="2" y="2" rx="15" fill="none" stroke="url(#accentGrad1)" stroke-width="1.5" opacity="0.6" class="animated-border" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="100" r="90" fill="#6366f1" opacity="0.4" class="pulse-bg1" />
  <circle cx="1000" cy="220" r="110" fill="#ec4899" opacity="0.3" class="pulse-bg2" />
  <circle cx="600" cy="160" r="130" fill="#38bdf8" opacity="0.15" class="pulse-bg1" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
  </g>

  <!-- Left Icon Illustration: Recurring Cycle & Smart Invoicing -->
  <g class="animated-float1" transform="translate(85, 75)">
    <rect x="0" y="10" width="130" height="145" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" opacity="0.9" />
    <rect x="15" y="30" width="100" height="16" rx="8" fill="url(#accentGrad1)" />
    <rect x="15" y="58" width="65" height="10" rx="5" fill="#475569" />
    <rect x="15" y="78" width="85" height="10" rx="5" fill="#334155" />
    <rect x="15" y="98" width="50" height="10" rx="5" fill="#334155" />
    <circle cx="100" cy="125" r="16" fill="url(#neonGlow)" filter="url(#softGlow)" />
    <path d="M94 125l4 4 8-8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Floating Metric Badges -->
  <g class="animated-float2" transform="translate(960, 65)">
    <rect x="0" y="0" width="155" height="60" rx="14" fill="#1e293b" stroke="url(#accentGrad2)" stroke-width="1.5" opacity="0.95" />
    <text x="15" y="26" fill="#94a3b8" class="text-badge">&#x26A1; Usage Metering</text>
    <text x="15" y="48" fill="#38bdf8" class="text-badge" font-size="14px">Real-time Events</text>

    <g transform="translate(-25, 85)">
      <rect x="0" y="0" width="170" height="60" rx="14" fill="#1e293b" stroke="url(#accentGrad1)" stroke-width="1.5" opacity="0.95" />
      <text x="15" y="26" fill="#94a3b8" class="text-badge">&#x1F504; Recurring Billing</text>
      <text x="15" y="48" fill="#ec4899" class="text-badge" font-size="14px">Automated Dunning</text>
    </g>
  </g>

  <!-- Central Typography -->
  <g transform="translate(290, 52)">
    <rect x="0" y="0" width="320" height="30" rx="15" fill="#1e293b" stroke="#4f46e5" stroke-width="1.2" />
    <circle cx="15" cy="15" r="5" fill="#10b981" filter="url(#softGlow)" />
    <text x="28" y="20" fill="#c7d2fe" class="text-badge">CURATED REVENUE &amp; BILLING ECOSYSTEM</text>
  </g>

  <text x="290" y="130" fill="#ffffff" class="text-title" font-size="36" letter-spacing="-0.5">
    Awesome <tspan fill="url(#accentGrad1)">Subscription Billing</tspan>
  </text>
  <text x="290" y="170" fill="#f8fafc" class="text-title" font-size="26" letter-spacing="-0.2">
    &amp; Revenue Infrastructure
  </text>

  <text x="290" y="212" fill="#94a3b8" class="text-subtitle" font-size="15">
    Top SaaS billing platforms, self-hosted open-source engines, usage metering,
  </text>
  <text x="290" y="234" fill="#94a3b8" class="text-subtitle" font-size="15">
    dunning automation, tax compliance &amp; recurring revenue lifecycle tools.
  </text>

  <!-- Pill Highlights -->
  <g transform="translate(290, 260)">
    <rect x="0" y="0" width="110" height="26" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="12" y="17" fill="#a5b4fc" class="text-badge" font-size="12px">&#x1F48E; Top SaaS</text>

    <rect x="120" y="0" width="135" height="26" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="132" y="17" fill="#6ee7b7" class="text-badge" font-size="12px">&#x1F680; Open-Source</text>

    <rect x="265" y="0" width="135" height="26" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
    <text x="277" y="17" fill="#d8b4fe" class="text-badge" font-size="12px">&#x1F4CA; Usage-Based</text>

    <rect x="410" y="0" width="145" height="26" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
    <text x="422" y="17" fill="#7dd3fc" class="text-badge" font-size="12px">&#x1F4B3; Invoicing &amp; MoR</text>
  </g>
</svg>
