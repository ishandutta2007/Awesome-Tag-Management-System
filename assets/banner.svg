<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19">
        <animate attributeName="stop-color" values="#0b0f19;#111827;#0d1527;#0b0f19" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e1b4b;#111827;#111827" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#090d16;#030712;#030712" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur">
        <animate attributeName="stdDeviation" values="8;16;8" dur="4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -120; }
    }
    .node-float1 { animation: float1 6s ease-in-out infinite; }
    .node-float2 { animation: float2 7s ease-in-out infinite; }
    .node-float3 { animation: float3 5s ease-in-out infinite; }
    .data-wire { stroke-dasharray: 8, 8; animation: dash 5s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .code-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Data Streams -->
  <g opacity="0.55">
    <path class="data-wire" d="M 120 180 C 260 90, 360 270, 520 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-wire" d="M 520 180 C 680 90, 800 270, 1080 180" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="data-wire" d="M 180 300 C 350 210, 750 310, 1020 90" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="90" r="80" fill="#0284c7" opacity="0.15" filter="url(#glow)">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="270" r="100" fill="#7c3aed" opacity="0.18" filter="url(#glow)">
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Tags / Badges -->
  <g class="node-float1" transform="translate(110, 75)">
    <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="20" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="26" fill="#f8fafc" font-size="13" class="code-badge">&lt;dataLayer/&gt;</text>
  </g>

  <g class="node-float2" transform="translate(940, 70)">
    <rect width="155" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="20" cy="21" r="5" fill="#a855f7" />
    <text x="36" y="26" fill="#f8fafc" font-size="13" class="code-badge">Server-Side TMS</text>
  </g>

  <g class="node-float3" transform="translate(970, 245)">
    <rect width="145" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="20" cy="21" r="5" fill="#10b981" />
    <text x="36" y="26" fill="#f8fafc" font-size="13" class="code-badge">Consent Mode</text>
  </g>

  <g class="node-float1" transform="translate(85, 245)">
    <rect width="150" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="20" cy="21" r="5" fill="#ec4899" />
    <text x="36" y="26" fill="#f8fafc" font-size="13" class="code-badge">Event Pipeline</text>
  </g>

  <!-- Central Title & Core Branding -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <!-- Tag Icon -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="30" fill="url(#primaryGrad)" filter="url(#pulseGlow)" />
      <path d="M -9 -11 L 5 -11 L 13 -3 L 3 7 L -9 7 Z" fill="#0f172a" />
      <circle cx="-3" cy="-2" r="2.5" fill="url(#primaryGrad)" />
      <path d="M -5 11 L 5 11 M -2 15 L 2 15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text y="24" fill="url(#primaryGrad)" font-size="38" letter-spacing="0.5" class="title-text" filter="url(#glow)">
      Awesome Tag Management System
    </text>

    <!-- Subtitle -->
    <text y="62" fill="#cbd5e1" font-size="16" letter-spacing="0.2" class="subtitle-text">
      Curated Ecosystem of Client-Side, Server-Side &amp; Privacy-First Tag Infrastructure
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 100)">
      <g transform="translate(-270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="5" fill="#38bdf8" font-size="12" class="code-badge" text-anchor="middle">⚡ Server-Side</text>
      </g>
      <g transform="translate(-90, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="5" fill="#818cf8" font-size="12" class="code-badge" text-anchor="middle">🛡️ Privacy &amp; CMP</text>
      </g>
      <g transform="translate(90, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="5" fill="#c084fc" font-size="12" class="code-badge" text-anchor="middle">📦 Open Source</text>
      </g>
      <g transform="translate(270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="5" fill="#34d399" font-size="12" class="code-badge" text-anchor="middle">🚀 Enterprise SaaS</text>
      </g>
    </g>
  </g>
</svg>
